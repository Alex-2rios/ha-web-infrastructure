name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --no-banner

  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit the python dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt

  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build backend/Dockerfile
        run: docker build -t scan-target-0 backend

      - name: Scan backend/Dockerfile for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target-0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Scan the compose files for misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
