name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the haproxy configuration
        run: |
          docker run --rm \
            -v "$PWD/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:2.9-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Check the compose file
        run: docker compose config -q

  failover:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up
        run: ./scripts/bootstrap.sh

      - name: The edge configuration has to be valid inside the network
        run: docker compose exec -T edge nginx -t

      - name: HAProxy has to expose prometheus metrics
        run: curl -sf http://localhost:8404/metrics | grep -q haproxy_server_status

      - name: Both backends have to join the pool and serve traffic
        run: |
          for attempt in $(seq 1 20); do
            seen=$(for i in $(seq 1 10); do
              curl -sk https://localhost:8443/api/whoami | sed -n 's/.*"node":"\([^"]*\)".*/\1/p'
            done | sort -u | tr '\n' ' ')
            echo "attempt $attempt, served by: $seen"
            if echo "$seen" | grep -q web1 && echo "$seen" | grep -q web2; then
              exit 0
            fi
            sleep 3
          done
          echo "only ever saw: $seen"
          curl -s http://localhost:8404/metrics | grep haproxy_server_status
          exit 1

      - name: Killing a backend must not drop a single request
        run: |
          ( sleep 3; docker stop ha-web2 ) &
          ok=0; limited=0; bad=0
          end=$(( $(date +%s) + 12 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 3 https://localhost:8443/api/whoami)
            case "$code" in
              200) ok=$((ok + 1)) ;;
              429) limited=$((limited + 1)) ;;
              *)   bad=$((bad + 1)); echo "unexpected status $code" ;;
            esac
          done
          echo "$ok served, $limited rate limited, $bad failed"
          test "$bad" -eq 0

      - name: Logs on failure
        if: failure()
        run: docker compose logs
