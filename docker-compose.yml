name: ha-web-infrastructure

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  edge:
    <<: *hardening
    image: nginx:1.27-alpine
    container_name: ha-edge
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - balancer
    networks:
      - frontend
    restart: unless-stopped

  balancer:
    <<: *hardening
    image: haproxy:2.9-alpine
    container_name: ha-balancer
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8404:8404"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - web1
      - web2
    networks:
      - frontend
      - backend
    restart: unless-stopped

  web1:
    <<: *hardening
    build: ./backend
    container_name: ha-web1
    environment:
      NODE_NAME: web1
      NODE_COLOR: "#2f6feb"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - backend
    restart: unless-stopped

  web2:
    <<: *hardening
    build: ./backend
    container_name: ha-web2
    environment:
      NODE_NAME: web2
      NODE_COLOR: "#1a7f4b"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
