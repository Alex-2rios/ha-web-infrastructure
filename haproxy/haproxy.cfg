global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 2
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

frontend http_in
    bind *:80
    default_backend app_pool

backend app_pool
    balance roundrobin
    default-server init-addr last,libc,none
    option httpchk GET /healthz
    http-check expect status 200
    cookie SRVID insert indirect nocache
    server web1 web1:5000 check inter 2s fall 2 rise 2 cookie web1
    server web2 web2:5000 check inter 2s fall 2 rise 2 cookie web2

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    http-request use-service prometheus-exporter if { path /metrics }
